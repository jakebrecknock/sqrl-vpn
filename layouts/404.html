{{/* SQrL: friendlier "page not found" screen (replaces Docsy's plain one). */ -}}
{{ define "main" -}}
<div class="td-content sqrl-404">
  <p class="sqrl-404__code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p>This page doesn’t exist, or it has moved.</p>
  <div class="sqrl-404__actions">
    <a class="btn btn-primary" href="{{ "" | relURL }}">Back to home</a>
    <a class="btn btn-outline-primary" href="{{ "tech/" | relURL }}">Tech</a>
    <a class="btn btn-outline-primary" href="{{ "competencies/" | relURL }}">Competencies</a>
  </div>
</div>
{{- end }}
